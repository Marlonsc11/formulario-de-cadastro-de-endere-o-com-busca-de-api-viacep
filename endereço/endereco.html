<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereço</title>
    <link rel="stylesheet" href="endereco.css">
    <link rel="stylesheet" href="../login/style.css">
</head>
<body>
    <main>
        <div id="container">
            <h1>Formulário de Endereço</h1>

            <form>
                <div class="container-campo-formulario" style="grid-column: span 2;">
                    <label for="Cep">Cep</label>
                    <input type="Cep" class="campo-formulario" name="Cep" id="Cep" maxlength="8" minlength="8">
                </div>

                <div class="container-campo-formulario">
                    <label for="Logradouro">Logradouro</label>
                  <input type="Logradouro" class="campo-formulario" name="Logradouro" id="Logradouro">
                </div>

                <div class="container-campo-formulario">
                    <label for="Complemento">Complemento</label>
                  <input type="Complemento" class="campo-formulario" name="Complemento" id="Complemento">
                </div>

                <div class="container-campo-formulario">
                    <label for="Numero">Número</label>
                  <input type="Numero" class="campo-formulario" name="Numero" id="Numero">
                </div>

                <div class="container-campo-formulario">
                    <label for="Bairro">Bairro</label>
                  <input type="Bairro" class="campo-formulario" name="Bairro" id="Bairro">
                </div>

                <div class="container-campo-formulario">
                    <label for="Cidade">Cidade</label>
                  <input type="Cidade" class="campo-formulario" name="Cidade" id="Cidade">
                </div>

                <div class="container-campo-formulario">
                    <label for="Estado">Estado</label>
                  <input type="Estado" class="campo-formulario" name="Estado" id="Estado">
                </div>

                <button id="btn-enviar">Enviar</button>
            </form>
        </div>
    </main>
    <script src="endereco.js"></script>
    
</body>
</html>
